site_name: OhtoAi - Blog
site_url: https://blog.ohtoai.top/
repo_url: https://github.com/Ohto-Ai/blog
site_description: Blog for Ohto-Ai
site_author: Ohto-Ai

theme:
  name: material
  custom_dir: overrides

  # Necessary for search to work properly
  include_search_page: false
  search_index_only: true

  # Default values, taken from mkdocs_theme.yml
  language: zh
  font:
    text: Roboto
    code: Roboto Mono

  favicon: assets/favicon.ico
  logo: assets/favicon.ico
  icon:
    repo: fontawesome/brands/github
    logo: logo
    admonition:
      note: octicons/tag-16
      abstract: octicons/checklist-16
      info: octicons/info-16
      tip: octicons/squirrel-16
      success: octicons/check-16
      question: octicons/question-16
      warning: octicons/alert-16
      failure: octicons/x-circle-16
      danger: octicons/zap-16
      bug: octicons/bug-16
      example: octicons/beaker-16
      quote: octicons/quote-16

  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    # - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.indexes 
    - toc.follow
    # - toc.integrate 
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - header.autohide
    - content.code.annotate 

  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default 
      primary: white
      toggle:
        icon: material/weather-sunny
        name: 切换到深色模式

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      toggle:
        icon: material/weather-night
        name: 切换到浅色模式
plugins:
  - search:
      lang: 
        - en
        - zh
extra:
  generator: true

  consent:
    title: Cookie consent
    description: >- 
      We use cookies to recognize your repeated visits and preferences, as well
      as to measure the effectiveness of our documentation and whether users
      find what they're searching for. With your consent, you're helping us to
      make our documentation better.
  social:
    - icon: fontawesome/solid/paper-plane
      link: mailto:zhu.thatboy@outlook.com
    - icon: fontawesome/brands/bilibili 
      link: https://space.bilibili.com/36225088
    - icon: fontawesome/brands/github 
      link: https://github.com/Ohto-Ai
    - icon: fontawesome/brands/twitter 
      link: https://twitter.com/OhtoAi_OvO
    - icon: fontawesome/brands/steam 
      link: https://steamcommunity.com/id/OhtoAi-02/
extra_css:
  - extra/css/extra.css
extra_javascript:
  - extra/js/increase_counter.js
  - extra/js/github-io-view-ctrl.js
  - extra/js/copyright-year.js
  - extra/js/cos-album-init.js
  # - https://cdn.staticfile.org/jquery/3.6.0/jquery.min.js
  # - extra/js/extra.js

# 不要在这里用 <script>document.write(...)：instant navigation 切页时会重新执行
# 内联脚本，document.write 在页面加载后调用会清空整个文档（表现为点击标题只剩年份）。
# 年份自动更新见 extra/js/copyright-year.js，静态 2026 是 JS 失效时的兜底。
copyright: >
  Copyright &copy; 2022–<span id="ohtoai-copyright-year">2026</span> <a href="https://ohtoai.top/">Ohto-Ai</a> –
  <a href="#__consent">Change cookie settings</a>

markdown_extensions:
  - attr_list
  - admonition
  - toc:
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - md_in_html
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:materialx.emoji.twemoji
      emoji_generator: !!python/name:materialx.emoji.to_svg

